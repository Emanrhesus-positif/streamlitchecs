[server]
# Exo 6 : endpoints /_stcore/agent/openapi.json, /interact et /mcp.
# En local, lancer avec --server.address 127.0.0.1 pour ne pas exposer l'API au réseau.
# Ne pas fixer address ici : Streamlit Cloud doit écouter sur toutes les interfaces.
enableAgentApi = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#7c9cff"
backgroundColor = "#05070d"
secondaryBackgroundColor = "#0d1424"
textColor = "#e5e7eb"
font = "sans serif"
